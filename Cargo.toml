[package]
name = "cloud-filter"
version = "0.0.7"
authors = [
  "ok-nick <nick.libraries@gmail.com>",
  "ho-229 <ho229v3666@gmail.com>",
]
edition = "2021"
rust-version = "1.93"
description = "A safe and idiomatic wrapper around the Windows Cloud Filter API"
license = "MIT"
repository = "https://github.com/ho-229/cloud-filter-rs"
documentation = "https://docs.rs/cloud-filter"
exclude = ["examples/", ".github/", "test/"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"

[dependencies]
flagset = "0.4.7"
widestring = "1.2.1"
nt-time = "0.15.0"
windows-collections = "0.3.2"
windows = { version = "0.62.2", features = [
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Storage_CloudFilters",
  "Win32_System_CorrelationVector",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Storage_Provider",
  "Win32_System_Memory",
  "Storage",
  "Storage_Search",
  "Foundation",
  "Win32_Security_Authorization",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Search",
  "Storage_Streams",
  "Win32_System_Ioctl",
  "Win32_Security",
] }
globset = { version = "0.4.21", optional = true }

[dev-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libtest-mimic = "0.8.2"
futures = "0.3.34"
anyhow = "1.0.104"
ssh2 = "0.9.6"
ctrlc = "3.5.2"

[features]
# Enable globs in the `info::FetchPlaceholders` struct.
globs = ["globset"]

[[test]]
harness = false
name = "behavior"
path = "tests/behavior/main.rs"
